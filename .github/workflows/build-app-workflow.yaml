name: build
on: [pull_request, push]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout the code
        uses: actions/checkout@v4
      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@699bb18358f12c5b78b37bb0111d3a0e2276e0e2
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Decode release keystore
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 is not set. Release APK will be unsigned."
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/idroot-release.p12"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/idroot-release.p12" >> "$GITHUB_ENV"
      - name: Build the app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew build
      - uses: actions/upload-artifact@v4
        with:
          name: apk-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Upload signed release APK
        if: env.KEYSTORE_FILE != ''
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: app/build/outputs/apk/release/*-release.apk
      - name: Publish signed APK
        if: env.KEYSTORE_FILE != '' && github.event_name == 'push' && github.ref == 'refs/heads/master'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          apks=(app/build/outputs/apk/release/*-release.apk)
          if [ ${#apks[@]} -eq 0 ]; then
            echo "No release APK was produced."
            exit 1
          fi
          cp "${apks[0]}" idroot-authenticator.apk
          checksum="$(sha256sum idroot-authenticator.apk | awk '{print $1}')"
          notes=$(printf '%s\n' \
            "Signed release of IDroot Authenticator 3.4.3-idroot.1." \
            "" \
            "Package: org.idroot.authenticator" \
            "SHA-256 of this APK: ${checksum}" \
            "" \
            "Certificate SHA-256:" \
            "5E:4A:D4:D4:84:AF:36:C8:66:B5:9C:FF:4A:54:09:8E:CC:7E:30:05:64:E4:E7:3F:B9:B8:14:9C:1A:20:63:2C" \
            "" \
            "Codes stay on the device. https://idroot.org" \
            "GPL-3 fork of Aegis. Not affiliated with Beem Development.")
          if gh release view v3.4.3-idroot.1 >/dev/null 2>&1; then
            gh release upload v3.4.3-idroot.1 idroot-authenticator.apk --clobber
          else
            gh release create v3.4.3-idroot.1 idroot-authenticator.apk \
              --title "IDroot Authenticator 3.4.3-idroot.1" \
              --notes "$notes"
          fi
  test:
    # The emulator suite belongs to upstream. This fork's check is the signed APK.
    if: github.repository == 'beemdevelopment/Aegis'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Tests
        uses: reactivecircus/android-emulator-runner@62dbb605bba737720e10b196cb4220d374026a6d
        with:
          api-level: 31
          arch: x86_64
          profile: pixel_3a
          heap-size: 512M
          ram-size: 4096M
          emulator-options: -memory 4096 -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          disk-size: 8G
          script: |
            mkdir -p artifacts/report
            adb logcat -c
            adb logcat -G 16M && adb logcat -g
            ./gradlew connectedCheck || touch tests_failing
            adb logcat -d > artifacts/logcat.txt
            cp -r app/build/reports/androidTests/connected/* artifacts/report/
            if adb shell '[ -e /sdcard/Pictures/screenshots ]'; then adb pull /sdcard/Pictures/screenshots artifacts/; fi
            test ! -f tests_failing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: instrumented-test-report
          path: |
            artifacts/*
          if-no-files-found: ignore
